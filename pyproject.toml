[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loraforge-ai"
version = "0.1.0"
description = "LoraForge AI — Auditable LoRA Fine-Tuning, Logit-Verified Standalone Export & Inference Engine by IntelligentStack AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "peft==0.12.0",
    "accelerate==0.33.0",
    "huggingface-hub==0.24.7",
    "safetensors==0.4.5",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
loraforge = "loraforge.cli:main"

[tool.setuptools.packages.find]
include = ["loraforge*"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
addopts = "-v --tb=short"

